<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mario To Do</title><link rel="stylesheet" href="style.css"></head><body>
<aside id="sidebar"><button class="profile" onclick="settings()"><span class="avatar">M</span><span><strong>Mario</strong><small>Mario To Do · On this Mac</small></span><span class="chevron">⌄</span></button><div class="search"><span>⌕</span><input id="search" aria-label="Search tasks" placeholder="Search" oninput="searchTasks(this.value)"><button id="clearSearch" onclick="clearSearch()" aria-label="Clear search">×</button></div><nav id="nav"></nav><div class="sidebar-bottom"><button onclick="newList()">＋ <span>New list</span></button><button onclick="newGroup()" title="New group" aria-label="New group">▣</button></div></aside>
<main id="main"><header><div><h1 id="heading">My Day</h1><p id="subtitle"></p></div><div class="header-actions"><button onclick="showSuggestions()" title="Suggestions" aria-label="Suggestions">☀</button><button onclick="toggleMenu()" title="List options" aria-label="List options">•••</button></div></header><div id="listMenu" class="popover hidden"></div><section id="tasks" aria-label="Tasks"></section><footer><form id="addForm"><span>＋</span><input id="newTask" placeholder="Add a task" aria-label="Add a task" autocomplete="off"><button title="Add task" aria-label="Add task">↵</button></form><div class="footer-caption"><span id="saveStatus">Saved on this Mac</span><span>⌘N new task · ⌘F search</span></div></footer></main>
<aside id="detail" class="hidden"></aside><aside id="suggestions" class="hidden"></aside><div id="toast" role="status"></div><dialog id="settingsDialog"></dialog><script src="app.js"></script></body></html>
